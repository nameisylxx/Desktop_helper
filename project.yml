name: DesktopHelper
options:
  bundleIdPrefix: com.nameisylxx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  DesktopHelper:
    type: application
    platform: macOS
    sources:
      - path: DesktopHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nameisylxx.DesktopHelper
        PRODUCT_NAME: DesktopHelper
        INFOPLIST_FILE: DesktopHelper/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DesktopHelper/Resources/DesktopHelper.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
